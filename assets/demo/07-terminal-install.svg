<rect x="160" y="140" width="1600" height="800" rx="18" fill="#111111"/>
<circle cx="204" cy="184" r="9" fill="#555"/><circle cx="234" cy="184" r="9" fill="#555"/><circle cx="264" cy="184" r="9" fill="#555"/>
<text x="960" y="192" text-anchor="middle" font-size="22" fill="#888" font-family="SF Mono, Menlo, Consolas, monospace">~/project — zsh</text>
<defs>
