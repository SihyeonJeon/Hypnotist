<text x="220" y="300" font-size="34" fill="#fafafa" font-family="SF Mono, Menlo, Consolas, monospace" clip-path="url(#c0)" xml:space="preserve"><tspan fill="#888">$ </tspan>uv tool install git+https://github.com/SihyeonJeon/Hypnotist</text>
