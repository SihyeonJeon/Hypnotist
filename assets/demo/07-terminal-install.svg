<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
<!-- Hypnotist demo: install step. MIT licensed. -->
<rect width="1920" height="1080" fill="#0d1117"/>
<rect x="160" y="100" width="1600" height="880" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<circle cx="204" cy="134" r="7" fill="#f85149"/><circle cx="228" cy="134" r="7" fill="#d29922"/><circle cx="252" cy="134" r="7" fill="#3fb950"/>
<text x="960" y="140" text-anchor="middle" font-size="18" fill="#8b949e" font-family="SF Mono, Menlo, Consolas, monospace">~/project — zsh</text>

<defs>
<clipPath id="cmd"><rect x="200" y="430" height="44" width="0"><animate attributeName="width" from="0" to="560" begin="0.4s" dur="1.6s" fill="freeze"/></rect></clipPath>
</defs>

<!-- Command centered vertically -->
<text x="200" y="460" font-size="32" fill="#e6edf3" font-family="SF Mono, Menlo, Consolas, monospace" clip-path="url(#cmd)" xml:space="preserve"><tspan fill="#8b949e">$ </tspan>pip install hypnotist</text>

<!-- Success -->
<text x="200" y="520" font-size="26" fill="#3fb950" font-family="SF Mono, Menlo, Consolas, monospace" opacity="0" xml:space="preserve">Successfully installed hypnotist-1.0.1<set attributeName="opacity" to="1" begin="2.6s" fill="freeze"/></text>
</svg>
